# 指標が何を測っているか (runvault の宣言．rs-runvault docs/metrics.ja.md)．
#
# 名前は `simulation/src/record.rs` が書いているものと一致していなければならない．
# ステップごとの指標 (`log_step`) と，試行群をまとめた指標 (`log_condition_summary`)
# の両方をここに置く．
#
# `direction` は «どちらが良いか»．占有クラス数や意見分散は模型の記述であって成績では
# ないので `none` を書く．例外は `convergence_rate` (試行がどれだけ使い物になったか)．

# --- ステップごと (scope=run, step=t) -------------------------------------

[metrics."n_occupied_classes"]
meaning   = "そのステップで占有されている意見クラスの数．1 なら合意，2 なら分極，3 以上なら多元"
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."mean"]
meaning   = "全エージェントの意見の平均"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."variance"]
meaning   = "全エージェントの意見の分散"
unit      = "ratio"
direction = "none"
scope     = ["run"]

[metrics."max_delta"]
meaning   = "1 ステップでの意見の変化量の最大値．収束判定に使う"
unit      = "ratio"
direction = "none"
scope     = ["run"]

# --- 試行 1 本ぶん (scope=run) ---------------------------------------------

[metrics."converged"]
meaning   = "収束して終わったなら 1，打ち切りなら 0"
unit      = "boolean"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."final_iteration"]
meaning   = "停止したときの反復回数"
unit      = "count"
direction = "none"
scope     = ["run"]

# --- 条件ごとの集計 (試行群の平均．scope=run) -------------------------------

[metrics."n_converged"]
meaning   = "この条件の試行のうち収束したものの本数"
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."convergence_rate"]
meaning   = "この条件の試行のうち収束したものの割合"
unit      = "ratio"
direction = "up"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."mean_n_occupied_classes"]
meaning   = "試行群にわたる，最終的な占有クラス数の平均．平均作用素を変えるとここが動く (本再現の主張)"
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."mean_opinion_mean"]
meaning   = "試行群にわたる最終意見平均の平均"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."mean_opinion_variance"]
meaning   = "試行群にわたる最終意見分散の平均"
unit      = "ratio"
direction = "none"
scope     = ["run"]

[metrics."mean_final_iteration"]
meaning   = "試行群にわたる，収束までの反復回数の平均"
unit      = "count"
direction = "none"
scope     = ["run"]

# --- 条件（parameters）の説明 -----------------------------------------------
#
# 鍵は JSON ポインタ．`config.json` の `/parameters` からの相対で指す．

[parameters."/n"]
meaning = "エージェント数 n"
unit    = "count"

[parameters."/eps"]
meaning = "対称信頼幅 ε"
range   = [0.0, 1.0]

[parameters."/mean"]
meaning = "平均化操作．A（算術）/ G（幾何）/ H（調和）/ P{p}（べき）/ R（この論文が比べる作用素）"

[parameters."/p"]
meaning = "べき平均 P_p の指数．他の平均では意味を持たないので null（0 で埋めると «p=0 の P» ＝ 幾何平均という別の条件に見える）"

[parameters."/start_profile"]
meaning = "初期意見の作り方．`uniform` は [0,1] の一様乱数（調和・幾何平均では開区間）"

[parameters."/max_iterations"]
meaning = "反復の上限 T"
unit    = "count"

[parameters."/tol"]
meaning = "収束判定の許容誤差．max|Δx| がこれを下回ったら止める（R では使わない）"

[parameters."/runs"]
meaning = "この条件で走らせる独立試行の本数"
unit    = "count"

[parameters."/seed"]
meaning = "試行のシードを派生させる基準の乱数種"

# --- sweep 親のグリッド定義 --------------------------------------------------

[parameters."/eps_min"]
meaning = "sweep が振る ε の下端"

[parameters."/eps_max"]
meaning = "sweep が振る ε の上端"

[parameters."/eps_step"]
meaning = "ε の刻み幅"

[parameters."/means"]
meaning = "sweep が比べる平均化作用素の並び（A / G / H / P{p} / R）"
